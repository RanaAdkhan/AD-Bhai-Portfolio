<style>
@font-face {
  font-family: "Jameel Noori Nastaleeq";

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Jameel Noori Nastaleeq', serif;
    background: #2b0d0d;
    color: #fff8e7;
    min-height: 100vh;
    padding: 18px 14px 40px;
  }
  .wrap { max-width: 520px; margin: 0 auto; text-align: center; }
  h1 { font-size: 30px; line-height: 2; color: #fac518; }
  .sub { font-size: 15px; line-height: 2.1; color: #f3e3b3; margin-bottom: 14px; }
  label { display: block; font-size: 17px; line-height: 2; margin-bottom: 4px; color: #fff; }
  input {
    width: 100%;
    font-family: 'Jameel Noori Nastaleeq', serif;
    font-size: 20px;
    line-height: 2.2;
    padding: 2px 16px;
    border-radius: 12px;
    border: 2px solid #fac518;
    background: #fffdf5;
    color: #1a1a1a;
    text-align: center;
    outline: none;
  }
  input:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(250,197,24,.45); }
  .hint { font-size: 13px; line-height: 2; color: #d8c9a3; margin: 6px 0 14px; }
  canvas {
    width: 100%;
    height: auto;
    border-radius: 14px;
    border: 3px solid #fac518;
    background: #fff;
    display: block;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  button {
    font-family: 'Jameel Noori Nastaleeq', serif;
    font-size: 18px;
    line-height: 2.1;
    padding: 2px 18px 6px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  .dl { background: #fac518; color: #2b0d0d; font-weight: 700; }
  .wa { background: #25d366; color: #fff; font-weight: 700; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .msg { font-size: 14px; line-height: 2; color: #ffe9a8; min-height: 28px; margin-top: 8px; }
  .foot { font-size: 12px; line-height: 2; color: #b9a67e; margin-top: 18px; }

<body>
<div class="wrap">
  <h1>دعوت نامہ بنائیں</h1>
  <p class="sub">جامعہ اسلامیہ باب العلوم، کہروڑ پکا<br>تقریبِ تکمیلِ دورۂ حدیث — 11 دسمبر، بروز جمعۃ المبارک، صبح 10 بجے تا نماز عصر</p>

  <label for="guestName">جس کو دعوت دینی ہے، اس کا نام لکھیں</label>
  <input id="guestName" type="text" dir="rtl" placeholder="مثلاً: مولانا احمد رضا" autocomplete="off">
  <p class="hint">نام لکھتے ہی نیچے دعوت نامے میں آ جائے گا — پھر ڈاؤن لوڈ کریں یا واٹس ایپ پر بھیجیں۔</p>


  <canvas id="card" width="1055" height="1491"></canvas>

    <button class="dl" id="dlBtn">⬇ تصویر ڈاؤن لوڈ کریں</button>

const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');
const input = document.getElementById('guestName');
const msg = document.getElementById('msg');
const W = 1055, H = 1491;
// نام والی جگہ: سفید پٹی (بخدمت جناب) — مرکز x=197، مرکز y=1126، زیادہ سے زیادہ چوڑائی 284
const NAME_CX = 197, NAME_CY = 1126, NAME_MAX_W = 284, NAME_SIZE = 76;
let fontReady = false;
let fontLoading = false;
let fontTries = 0;

async function ensureFont() {
  if (!document.fonts || fontReady || fontLoading || fontTries >= 3) return;
  fontLoading = true;
  fontTries++;
  try {
    await document.fonts.load('76px "Jameel Noori Nastaleeq"');
    fontReady = document.fonts.check('76px "Jameel Noori Nastaleeq"');
  } catch (e) { fontReady = false; }
  fontLoading = false;
  if (!fontReady && fontTries >= 3) msg.textContent = 'فونٹ لوڈ نہیں ہو سکا — انٹرنیٹ چیک کر کے صفحہ دوبارہ کھولیں۔';
  draw();
}

const poster = new Image();
let posterReady = false;
poster.onload = () => { posterReady = true; draw(); };
poster.src = POSTER;

function fitFont(name) {
  let size = NAME_SIZE;
  ctx.font = size + 'px "Jameel Noori Nastaleeq", serif';
  while (size > 28 && ctx.measureText(name).width > NAME_MAX_W) {
    size -= 2;
    ctx.font = size + 'px "Jameel Noori Nastaleeq", serif';
  }
  return size;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (posterReady) ctx.drawImage(poster, 0, 0, W, H);
  const name = input.value.trim();
  if (!name) return;
  if (!fontReady) {
    if (fontTries >= 3) { msg.textContent = 'فونٹ لوڈ نہیں ہو سکا — انٹرنیٹ چیک کر کے صفحہ دوبارہ کھولیں۔'; return; }
    msg.textContent = 'فونٹ لوڈ ہو رہا ہے — چند لمحے انتظار کریں...';
    ensureFont();
    return;
  }
  msg.textContent = '';
  const size = fitFont(name);
  ctx.font = size + 'px "Jameel Noori Nastaleeq", serif';
  ctx.fillStyle = '#141414';
  ctx.strokeStyle = '#141414';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeText(name, NAME_CX, NAME_CY);
  ctx.fillText(name, NAME_CX, NAME_CY);
}

input.addEventListener('input', draw);
ensureFont();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

function needName() {
  if (!input.value.trim()) {
    msg.textContent = 'پہلے اوپر مہمان کا نام لکھیں۔';
    input.focus();
    return false;
  }
  return true;
}

document.getElementById('dlBtn').addEventListener('click', () => {
  if (!needName()) return;
  if (!fontReady) { msg.textContent = 'فونٹ ابھی لوڈ ہو رہا ہے — چند لمحے انتظار کریں، پھر دوبارہ کوشش کریں۔'; ensureFont(); return; }
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dawat-nama-' + input.value.trim().replace(/\s+/g, '-') + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    msg.textContent = 'تصویر ڈاؤن لوڈ ہو گئی — اب اسے واٹس ایپ پر بھیج سکتے ہیں۔';
  }, 'image/png');
});

document.getElementById('waBtn').addEventListener('click', async () => {
  if (!needName()) return;
  if (!fontReady) { msg.textContent = 'فونٹ ابھی لوڈ ہو رہا ہے — چند لمحے انتظار کریں، پھر دوبارہ کوشش کریں۔'; ensureFont(); return; }
  msg.textContent = '';
  canvas.toBlob(async blob => {
    const file = new File([blob], 'dawat-nama.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: 'دعوت نامہ',
          text: 'دعوت نامہ — تقریبِ تکمیلِ دورۂ حدیث، جامعہ اسلامیہ باب العلوم، 11 دسمبر'
        });
        msg.textContent = 'بھیج دیا گیا۔';
      } catch (e) {
        if (e && e.name !== 'AbortError') msg.textContent = 'شیئر نہیں ہو سکا — تصویر ڈاؤن لوڈ کر کے گیلری سے بھیج دیں۔';
      }
    } else {
      msg.textContent = 'اس براؤزر میں براہِ راست شیئر نہیں ہوتا — تصویر ڈاؤن لوڈ کر کے گیلری سے واٹس ایپ پر بھیج دیں۔';
      document.getElementById('dlBtn').click();
    }
  }, 'image/png');
});
</script>
