<style>

    font-size: 20px;

    height: auto;

    background: #fff;

<div class="wrap">
  <h1>دعوت نامہ بنائیں</h1>
  <p class="sub">جامعہ اسلامیہ باب العلوم، کہروڑ پکا<br>تقریبِ تکمیلِ دورۂ حدیث — 11 دسمبر، بروز جمعۃ المبارک، صبح 10 بجے تا نماز عصر</p>

  <label for="guestName">جس کو دعوت دینی ہے، اس کا نام لکھیں</label>

const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');
const input = document.getElementById('guestName');
const msg = document.getElementById('msg');
const W = 1055, H = 1491;
// نام والی جگہ: سفید پٹی (بخدمت جناب) — مرکز x=197، مرکز y=1126، زیادہ سے زیادہ چوڑائی 284
const NAME_CX = 197, NAME_CY = 1126, NAME_MAX_W = 284, NAME_SIZE = 76;
let fontReady = false;
let fontLoading = false;
let fontTries = 0;

async function ensureFont() {
  if (!document.fonts || fontReady || fontLoading || fontTries >= 3) return;
  fontLoading = true;
  fontTries++;
  try {
    await document.fonts.load('76px "Jameel Noori Nastaleeq"');
    fontReady = document.fonts.check('76px "Jameel Noori Nastaleeq"');
  } catch (e) { fontReady = false; }
  fontLoading = false;
  if (!fontReady && fontTries >= 3) msg.textContent = 'فونٹ لوڈ نہیں ہو سکا — انٹرنیٹ چیک کر کے صفحہ دوبارہ کھولیں۔';
  draw();
}

const poster = new Image();
let posterReady = false;
poster.onload = () => { posterReady = true; draw(); };
poster.src = POSTER;

function fitFont(name) {
  let size = NAME_SIZE;
  ctx.font = size + 'px "Jameel Noori Nastaleeq", serif';
  while (size > 28 && ctx.measureText(name).width > NAME_MAX_W) {
    size -= 2;
    ctx.font = size + 'px "Jameel Noori Nastaleeq", serif';
  }
  return size;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (posterReady) ctx.drawImage(poster, 0, 0, W, H);
  const name = input.value.trim();
  if (!name) return;
  if (!fontReady) {
    if (fontTries >= 3) { msg.textContent = 'فونٹ لوڈ نہیں ہو سکا — انٹرنیٹ چیک کر کے صفحہ دوبارہ کھولیں۔'; return; }
    msg.textContent = 'فونٹ لوڈ ہو رہا ہے — چند لمحے انتظار کریں...';
    ensureFont();
    return;
  }
  msg.textContent = '';
  const size = fitFont(name);
  ctx.font = size + 'px "Jameel Noori Nastaleeq", serif';
  ctx.fillStyle = '#141414';
  ctx.strokeStyle = '#141414';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeText(name, NAME_CX, NAME_CY);
  ctx.fillText(name, NAME_CX, NAME_CY);
}

input.addEventListener('input', draw);
ensureFont();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

function needName() {
  if (!input.value.trim()) {
    msg.textContent = 'پہلے اوپر مہمان کا نام لکھیں۔';
    input.focus();
    return false;
  }
  return true;
}

document.getElementById('dlBtn').addEventListener('click', () => {
  if (!needName()) return;
  if (!fontReady) { msg.textContent = 'فونٹ ابھی لوڈ ہو رہا ہے — چند لمحے انتظار کریں، پھر دوبارہ کوشش کریں۔'; ensureFont(); return; }
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dawat-nama-' + input.value.trim().replace(/\s+/g, '-') + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    msg.textContent = 'تصویر ڈاؤن لوڈ ہو گئی — اب اسے واٹس ایپ پر بھیج سکتے ہیں۔';
  }, 'image/png');
});

document.getElementById('waBtn').addEventListener('click', async () => {
  if (!needName()) return;
  if (!fontReady) { msg.textContent = 'فونٹ ابھی لوڈ ہو رہا ہے — چند لمحے انتظار کریں، پھر دوبارہ کوشش کریں۔'; ensureFont(); return; }
  msg.textContent = '';
  canvas.toBlob(async blob => {
    const file = new File([blob], 'dawat-nama.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: 'دعوت نامہ',
          text: 'دعوت نامہ — تقریبِ تکمیلِ دورۂ حدیث، جامعہ اسلامیہ باب العلوم، 11 دسمبر'
        });
        msg.textContent = 'بھیج دیا گیا۔';
      } catch (e) {
        if (e && e.name !== 'AbortError') msg.textContent = 'شیئر نہیں ہو سکا — تصویر ڈاؤن لوڈ کر کے گیلری سے بھیج دیں۔';
      }
    } else {
      msg.textContent = 'اس براؤزر میں براہِ راست شیئر نہیں ہوتا — تصویر ڈاؤن لوڈ کر کے گیلری سے واٹس ایپ پر بھیج دیں۔';
      document.getElementById('dlBtn').click();
    }
  }, 'image/png');
});
</script>
